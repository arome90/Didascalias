<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HIMU test</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="stylesheet" href="css/style.css"> (Cambio para el servidor)-->
</head>
<body>
    <div id="video-frame">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <div id="session-form">
        <label for="session-id" style="color:white">ID de sesión (4 dígitos):</label>
        <input type="text" id="session-id" maxlength="4" inputmode="numeric" pattern="\d{4}" placeholder="1234">
    </div>
    <button id="button">Conectar</button>
    <div id="status">Desconectado</div>

    <script src="main.js"></script>
    <!-- <script src="js/main.js"></script> (Cambio para el servidor)-->
</body>
</html>
